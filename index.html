<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Game Boy Emulator</title>
    <style>
        :root {
            --lcd-bg: #cadc9f;
            /* Game Boy screen tone */
            --lcd-darker: #b6ca8f;
            /* subtle contrast for cards */
            --lcd-text: #1a2e10;
            /* dark green text */
            --lcd-border: #8fa37b;
            --flag-on: #274e13;
            /* deep green */
            --flag-off: #667a54;
            /* muted olive */
            font-family: 'Courier New', monospace;
        }

        body {
            background: var(--lcd-bg);
            color: var(--lcd-text);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        h1 {
            font-size: 18px;
            margin: 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85;
        }

        .card {
            background: var(--lcd-darker);
            border: 2px solid var(--lcd-border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px 14px;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            padding: 6px 10px;
        }

        .label {
            opacity: 0.75;
            font-weight: bold;
        }

        .value {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .mono {
            font-variant-numeric: tabular-nums;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: bold;
            border: 1px solid var(--flag-off);
            background: rgba(255, 255, 255, 0.15);
            color: var(--flag-off);
            transition: all 0.2s;
        }

        .badge.on {
            color: var(--flag-on);
            border-color: var(--flag-on);
            background: rgba(39, 78, 19, 0.2);
        }

        .badge.off {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="row">
        <button id="step">Step</button>
        <button id="auto">Auto Run</button>
        <button id="reset">Reset</button>
    </div>
    <h1>CPU Registers</h1>

    <div class="card" style="margin-bottom:16px;">
        <div class="grid">
            <div class="cell">
                <span class="label">A</span>
                <span id="reg-a" class="value mono">0x00</span>
            </div>
            <div class="cell">
                <span class="label">F</span>
                <span id="reg-f" class="value mono">0x00</span>
            </div>
            <div class="cell">
                <span class="label">B</span>
                <span id="reg-b" class="value mono">0x00</span>
            </div>
            <div class="cell">
                <span class="label">C</span>
                <span id="reg-c" class="value mono">0x00</span>
            </div>

            <div class="cell">
                <span class="label">D</span>
                <span id="reg-d" class="value mono">0x00</span>
            </div>
            <div class="cell">
                <span class="label">E</span>
                <span id="reg-e" class="value mono">0x00</span>
            </div>
            <div class="cell">
                <span class="label">H</span>
                <span id="reg-h" class="value mono">0x00</span>
            </div>
            <div class="cell">
                <span class="label">L</span>
                <span id="reg-l" class="value mono">0x00</span>
            </div>

            <div class="cell">
                <span class="label">PC</span>
                <span id="reg-pc" class="value mono">0x0000</span>
            </div>
            <div class="cell">
                <span class="label">SP</span>
                <span id="reg-sp" class="value mono">0x0000</span>
            </div>
        </div>
    </div>

    <h1>Flags</h1>
    <div class="card">
        <div class="row">
            <span id="flag-z" class="badge off">Z (Zero)</span>
            <span id="flag-n" class="badge off">N (Subtract)</span>
            <span id="flag-h" class="badge off">H (Half-Carry)</span>
            <span id="flag-c" class="badge off">C (Carry)</span>
        </div>
    </div>
    <input type="file" id="romInput" accept=".gb" title="Select a file" />
    <button id="btn-debug" type="button" aria-pressed="false">Debug: ON</button>
    <canvas id="screen" width="160" height="144" style="image-rendering: pixelated;"></canvas>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
